name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    # Only newly created tags; tag moves and deletions never release.
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Match tag, package version, and installer CLI_VERSION
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::Tag '$TAG' is not v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          version="${TAG#v}"

          package_version="$(jq -r .version package.json)"
          if [ "$package_version" != "$version" ]; then
            echo "::error::package.json version '$package_version' does not match tag '$TAG'"
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          # Stable releases must leave CLI_VERSION empty so installs follow the latest stable release;
          # a pre-release may set it to its own tag. Read as text; never execute the installer here.
          installer=skills/consensus/scripts/install.sh
          if [ "$(grep -c '^CLI_VERSION="[^"]*"$' "$installer")" != 1 ]; then
            echo "::error::$installer must contain exactly one CLI_VERSION=\"...\" line"
            exit 1
          fi
          cli_version="$(sed -n 's/^CLI_VERSION="\(.*\)"$/\1/p' "$installer")"
          if [ -n "$cli_version" ] && { [ "$prerelease" = false ] || [ "$cli_version" != "$TAG" ]; }; then
            echo "::error::$installer CLI_VERSION is '$cli_version'; it must be empty for a stable release, or '$TAG' for this pre-release"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.asset }}
    needs: [validate, ci]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
            asset: consensus-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: consensus-linux-arm64
          - runner: macos-15
            target: bun-darwin-arm64
            asset: consensus-darwin-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: consensus-darwin-x64
          - runner: windows-2025
            target: bun-windows-x64
            asset: consensus-windows-x64.exe

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Uses the Bun version from package.json packageManager.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Native builds install this platform's optional packages, unlike cross-compiles.
      - name: Compile binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: bun build --minify --compile src/cli.ts --target="$TARGET" --outfile "$RUNNER_TEMP/release/$ASSET"

      # Runs the exact file that is uploaded, outside the checkout and without node_modules.
      - name: Smoke test binary
        shell: bash
        working-directory: ${{ runner.temp }}/release
        env:
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          bun "$GITHUB_WORKSPACE/scripts/smoke-test-cli.ts" "./$ASSET" "$VERSION"

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download tested binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          pattern: consensus-*
          merge-multiple: true

      - name: Check binaries and write checksums
        working-directory: release
        run: |
          set -euo pipefail
          export LC_ALL=C
          expected=(consensus-darwin-arm64 consensus-darwin-x64 consensus-linux-arm64 consensus-linux-x64 consensus-windows-x64.exe)
          actual=(*)
          if [ "${actual[*]}" != "${expected[*]}" ]; then
            echo "::error::Expected binaries '${expected[*]}', found '${actual[*]}'"
            exit 1
          fi
          for file in "${expected[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is empty"
              exit 1
            fi
          done
          # Bare file names with two spaces, as skills/consensus/scripts/install.sh expects.
          sha256sum "${expected[@]}" > checksums.sha256
          cat checksums.sha256

      # Creates or reuses a draft; publishing stays manual. Immutable releases lock published assets.
      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/consensus-*
            release/checksums.sha256
