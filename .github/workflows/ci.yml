name: CI

on:
  push:
    # Tags are checked by the Release workflow, which calls this workflow.
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  # A literal prefix: a called workflow sees its caller's github.workflow,
  # so reusing it here would cancel the calling Release run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Uses the Bun version from package.json packageManager.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:check

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bunx tsc -p tsconfig.json --noEmit

      - name: Run tests
        run: bun run test
